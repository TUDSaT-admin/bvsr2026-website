<h2 mat-dialog-title class="tour-dialog-heading">
  <span class="tour-dialog-heading-text">Tour selection</span>
</h2>
<div class="tour-dialog-accent" aria-hidden="true"></div>

<mat-dialog-content class="tour-dialog-body">
  <app-tour-selection-wizard
    appearance="dialog"
    [prefillEmail]="data?.email ?? ''"
    [prefillFirstName]="data?.firstName ?? ''"
    [prefillLastName]="data?.lastName ?? ''"
    [autoStartWhenPrefilled]="true"
    (completed)="onWizardCompleted()"
  />
</mat-dialog-content>

<mat-dialog-actions class="tour-dialog-actions" align="end">
  <button mat-button mat-dialog-close type="button" class="tour-dialog-close-footer">Close</button>
</mat-dialog-actions>
