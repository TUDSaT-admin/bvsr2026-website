<app-navbar></app-navbar>

<section class="speakers-page">
  <div class="speakers-wrapper">
    <div class="page-heading">
      <h1 class="page-title">{{ 'speakers.title' | translate }}</h1>
    </div>

    <div class="cards-grid">
      <button
        *ngFor="let speaker of speakers"
        type="button"
        class="speaker-card"
        [class.active]="selectedSpeakerId === speaker.id"
        (click)="selectSpeaker(speaker.id)">
        <figure class="speaker-image-wrap">
          <img
            [src]="speaker.image"
            [alt]="speaker.name"
            class="speaker-image"
            [class.speaker-image-volker]="speaker.id === 'volker-schmid'"
            [class.speaker-image-michael]="speaker.name === 'Michael Boss'" />
          <figcaption *ngIf="speaker.imageCredit" class="speaker-image-credit">{{ speaker.imageCredit }}</figcaption>
        </figure>
        <div class="speaker-info">
          <h2
            class="speaker-name"
            [class.speaker-title-compact]="speaker.id === 'momentum-aerospace'">
            {{ speaker.name }}</h2>
          <p class="speaker-position" *ngIf="tr(speaker, 'position') as positionText">{{ positionText }}</p>
        </div>
      </button>
    </div>
  </div>

  <div class="speaker-modal-overlay" *ngIf="selectedSpeaker as speaker" (click)="closeSpeaker()">
    <div class="speaker-modal" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" [attr.aria-label]="'speakers.closeDialog' | translate" (click)="closeSpeaker()">×</button>

      <div class="details-head">
        <h2
          class="details-name"
          [class.details-title-compact]="speaker.id === 'momentum-aerospace'">
          {{ speaker.name }}</h2>
        <p class="details-position" *ngIf="tr(speaker, 'position') as positionText">{{ positionText }}</p>
        <p class="details-talk" *ngIf="tr(speaker, 'talkTitle') as talkTitleText">{{ talkTitleText }}</p>
      </div>

      <div class="details-content">
        <p *ngFor="let paragraph of contentParagraphs(speaker)">{{ paragraph }}</p>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
